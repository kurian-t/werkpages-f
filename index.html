<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Werkpages – Anonymous Manager Reviews & Ratings</title>

    <!-- No hero preload here. index.html is shared by every route in this SPA, so preloading
         one page's illustration downloads it for visitors who never see that page - this
         previously pulled a 2.3 MB PNG on every single route, for an image no page renders
         any more. The heroes carry fetchPriority="high" instead, which gets the LCP benefit
         on the route that actually needs it. -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=7" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo-icon-512.png?v=7" />
    <link rel="apple-touch-icon" sizes="512x512" href="/logo-icon-512.png?v=7" />

    <meta property="og:title" content="Werkpages" />
    <meta
      property="og:description"
      content="Honest insight into the managers you'll work with. Read and share anonymous manager reviews."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://werkpages.com" />
    <meta property="og:image" content="https://werkpages.com/og-image.png" />
    <meta property="og:site_name" content="Werkpages" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Werkpages" />
    <meta
      name="twitter:description"
      content="Honest insight into the managers you'll work with."
    />
    <meta name="twitter:image" content="https://werkpages.com/og-image.png" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Werkpages",
      "url": "https://werkpages.com",
      "logo": "https://werkpages.com/logo-icon-512.png",
      "sameAs": []
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/client/App.tsx"></script>
  </body>
</html>
