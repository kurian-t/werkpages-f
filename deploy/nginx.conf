server {
    listen 80;
    server_name ratemymanagers.ca www.ratemymanagers.ca;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name ratemymanagers.ca www.ratemymanagers.ca;
    ssl_certificate /etc/letsencrypt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://challenges.cloudflare.com; font-src 'self' https://fonts.gstatic.com; frame-src https://challenges.cloudflare.com; object-src 'none'; frame-ancestors 'none';" always;

    # Block common attack/scanner paths
    location ~* ^/(\.env|\.git|\.htaccess|\.htpasswd|wp-admin|wp-login\.php|phpinfo\.php|adminer|phpmyadmin) {
        return 404;
    }

    location /api/ {
        proxy_pass http://api:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }
    # Never cache the HTML shell — it must always be fresh so Cloudflare/CDN
    # doesn't serve a stale or empty version that causes a blank page.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}