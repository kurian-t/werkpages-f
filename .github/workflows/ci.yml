name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ca-central-1
  ECR_REGISTRY: 138465306929.dkr.ecr.ca-central-1.amazonaws.com
  FRONTEND_IMAGE: 138465306929.dkr.ecr.ca-central-1.amazonaws.com/werkpages-frontend
  BACKEND_IMAGE: 138465306929.dkr.ecr.ca-central-1.amazonaws.com/werkpages-api

# Least privilege. These jobs read the repository and upload artifacts; nothing writes back to
# it. The default token is broader than that on many org configurations, and the deploy job
# below holds real AWS credentials, so the grant is stated rather than inherited.
permissions:
  contents: read

# A second push to the same branch makes the first run's result irrelevant. Cancelling it frees
# runners instead of paying for an answer nobody will read. Never cancels on main, because that
# run is the deploy gate.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Playwright Tests
    # 20, down from 30, and EVERY STEP CARRIES ITS OWN CAP.
    #
    # On 2026-11-14 both shards of this job hit a 30-minute job cap and were cancelled. The 117
    # tests they were running take 22 SECONDS locally, so that was a hang, not slowness - and a
    # single job-level cap is the worst possible way to find a hang, because it bills the full
    # thirty minutes per shard and then tells you only that "the job" exceeded it. The per-step
    # caps below exist so the next hang names itself, in minutes instead of half an hour.
    timeout-minutes: 20
    runs-on: ubuntu-latest

    # NO MATRIX, NO SHARDING. 117 tests at 22 seconds do not need splitting; sharding them bought
    # nothing and duplicated the whole setup - install, typecheck, build, browser deps - on a
    # second runner. Two shards therefore cost roughly twice one job and saved no wall clock. On an
    # account with a monthly Actions budget that is the wrong trade. Sharding belongs in
    # full-suite.yml, where 1,418 tests actually justify it.

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        timeout-minutes: 6
        run: pnpm install --frozen-lockfile

      - name: Type check
        timeout-minutes: 4
        run: npx tsc --noEmit

      - name: Build client
        timeout-minutes: 5
        run: pnpm build:client
        env:
          VITE_AUTH0_DOMAIN: test.auth0.com
          VITE_AUTH0_CLIENT_ID: test_client_id_for_e2e
          VITE_AUTH0_AUDIENCE: https://api.test.example/
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

      # NO `playwright install-deps chromium`.
      #
      # It ran apt-get, with sudo, over the network, and it was the one step here capable of
      # hanging for thirty minutes on a dpkg lock or a slow mirror. It was also unnecessary: the
      # chromium project sets `channel: process.env.CI ? "chrome" : undefined`, so on a runner
      # every test launches the Google Chrome that ubuntu-latest already ships, with its own
      # dependencies already satisfied by the image.
      #
      # If Chrome ever does lack a library, the failure is an immediate and explicit launch error
      # naming the missing library, which is a far better outcome than an apt-get that never
      # returns.
      #
      # ffmpeg stays, and it is not optional: `retries: 1` with `video: "on-first-retry"` means a
      # retry records video, and recording needs Playwright's own ffmpeg binary. Without it a
      # single flake dies with "Executable doesn't exist ... ffmpeg-linux" before the test runs.
      # Measured cold: 2.3 MiB in 1.4 seconds.
      - name: Install Playwright ffmpeg
        timeout-minutes: 3
        run: pnpm exec playwright install ffmpeg

      # The @ci subset, push and pull request alike. The whole project runs in full-suite.yml.
      - name: Run the tests
        timeout-minutes: 8
        run: pnpm exec playwright test --project=chromium --grep "$CI_SUBSET"
        env:
          # Overridable from repository variables without editing this file.
          CI_SUBSET: ${{ vars.CI_GREP || '@ci' }}

      # ── The role-aware journeys ──────────────────────────────────────────────
      #
      # VITE_ROLE_AWARE_SUBMISSION is baked into the bundle at BUILD time, and the standard build
      # has it off because that is what production serves. So these journeys need a second bundle,
      # and without one they skip in every run while the suite total looks as though they were
      # covered. That was issue 36. The spec FAILS rather than skips when run without the flag, so
      # a misconfiguration here is loud instead of invisible.
      #
      # `!cancelled()` rather than `success()`: a failure in the tests above must not hide a
      # role-aware regression. Both answers come out of one run.
      - name: Rebuild the client WITH the role-aware flag
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: pnpm build:client
        env:
          VITE_ROLE_AWARE_SUBMISSION: "true"
          VITE_AUTH0_DOMAIN: test.auth0.com
          VITE_AUTH0_CLIENT_ID: test_client_id_for_e2e
          VITE_AUTH0_AUDIENCE: https://api.test.example/
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

      - name: Run the role-aware contribution journeys
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: pnpm exec playwright test tests/role-aware-contribution.spec.ts --project=chromium
        env:
          VITE_ROLE_AWARE_SUBMISSION: "true"

      # ONE JOB MEANS ONE REPORT, so there is nothing to merge.
      #
      # The separate "Merge test reports" job is gone with the sharding. It existed only to stitch
      # per-shard blob reports together, and on the cancelled run it failed on its own account with
      # "Directory does not exist: .../all-blob-reports" - because the shards never got far enough
      # to upload anything. A job whose only failure mode is a confusing second error is not worth
      # its minutes.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  deploy:
    name: Build & Deploy
    needs: test
    if: github.event_name == 'push'
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ── Frontend ────────────────────────────────────────────────────────────
      - name: Build & push frontend
        run: |
          docker build --no-cache \
            --build-arg "VITE_API_URL=https://werkpages.com" \
            --build-arg "VITE_AUTH0_DOMAIN=${{ secrets.VITE_AUTH0_DOMAIN }}" \
            --build-arg "VITE_AUTH0_CLIENT_ID=${{ secrets.VITE_AUTH0_CLIENT_ID }}" \
            --build-arg "VITE_AUTH0_AUDIENCE=${{ secrets.VITE_AUTH0_AUDIENCE }}" \
            --build-arg "VITE_TURNSTILE_SITE_KEY=${{ secrets.VITE_TURNSTILE_SITE_KEY }}" \
            --build-arg "VITE_POSTHOG_KEY=${{ secrets.VITE_POSTHOG_KEY }}" \
            --build-arg "VITE_POSTHOG_HOST=${{ secrets.VITE_POSTHOG_HOST }}" \
            -t "${{ env.FRONTEND_IMAGE }}:latest" \
            -t "${{ env.FRONTEND_IMAGE }}:${{ github.sha }}" \
            -f Dockerfile .
          docker push ${{ env.FRONTEND_IMAGE }}:latest
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      # ── Backend ─────────────────────────────────────────────────────────────
      - name: Checkout backend repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BACKEND_REPO }}
          token: ${{ secrets.GH_PAT }}
          path: backend

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build backend JAR
        working-directory: backend
        run: mvn clean package

      - name: Build & push backend
        working-directory: backend
        run: |
          docker build \
            -t ${{ env.BACKEND_IMAGE }}:latest \
            -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} .
          docker push ${{ env.BACKEND_IMAGE }}:latest
          docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      # ── Deploy to EC2 via SSM (no open ports needed) ─────────────────────────
      # Only the two werkpages services are pulled and recreated. RateMyManagers'
      # containers are deliberately left running — its edge nginx re-resolves the
      # werkpages-frontend address at request time, so it picks up the new container
      # without a reload.
      - name: Deploy on EC2
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands=["aws ecr get-login-password --region ca-central-1 | docker login --username AWS --password-stdin 138465306929.dkr.ecr.ca-central-1.amazonaws.com && cd /home/ubuntu/app && docker compose pull werkpages-api werkpages-frontend && docker compose up -d werkpages-api werkpages-frontend && docker image prune -af"] \
            --region ca-central-1
