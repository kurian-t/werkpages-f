version: "3.9"

services:

  # ── PostgreSQL (local dev only) ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: werkpages-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: werkpages
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── pgAdmin (port 5050) ──────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: werkpages-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # ── Java Vert.x API (port 8888) ──────────────────────────────────────────────
  api:
    build:
      context: /home/noragrats/eclipse-workspace/WerkpagesBackend/WerkpagesBackend
      dockerfile: Dockerfile
    container_name: werkpages-api
    ports:
      - "8888:8888"
    env_file:
      - .env.local
    environment:
      USE_AWS_SECRETS: "false"
    depends_on:
      postgres:
        condition: service_healthy

  # ── React Frontend (port 8080) ───────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY}
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN:-}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID:-}
    container_name: werkpages-frontend
    ports:
      - "8080:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api

volumes:
  pgdata:
