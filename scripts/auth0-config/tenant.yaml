rules: []
pages: []
resourceServers:
  - name: Werkpages API
    identifier: https://api.werkpages.com/
    allow_offline_access: false
    signing_alg: RS256
    skip_consent_for_verifiable_first_party_clients: true
    subject_type_authorization:
      user:
        policy: require_client_grant
      client:
        policy: require_client_grant
    token_dialect: access_token
    token_lifetime: 86400
    token_lifetime_for_web: 7200
  - name: user
    identifier: https://werkpages.com/api
    allow_offline_access: false
    signing_alg: RS256
    skip_consent_for_verifiable_first_party_clients: true
    subject_type_authorization:
      client:
        policy: require_client_grant
      user:
        policy: allow_all
    token_dialect: access_token
    token_lifetime: 86400
    token_lifetime_for_web: 7200
clients:
  - name: Auth0 Deploy CLI
    app_type: non_interactive
    cross_origin_authentication: false
    custom_login_page_on: true
    grant_types:
      - client_credentials
    is_first_party: true
    is_token_endpoint_ip_header_trusted: false
    jwt_configuration:
      alg: RS256
      lifetime_in_seconds: 36000
      secret_encoded: false
    oidc_conformant: true
    refresh_token:
      expiration_type: non-expiring
      leeway: 0
      infinite_token_lifetime: true
      infinite_idle_token_lifetime: true
      token_lifetime: 31557600
      idle_token_lifetime: 2592000
      rotation_type: non-rotating
    sso_disabled: false
    token_endpoint_auth_method: client_secret_post
  - name: Default App
    callbacks: []
    cross_origin_authentication: false
    custom_login_page_on: true
    grant_types:
      - authorization_code
      - implicit
      - refresh_token
      - client_credentials
    is_first_party: true
    is_token_endpoint_ip_header_trusted: false
    jwt_configuration:
      alg: RS256
      lifetime_in_seconds: 36000
      secret_encoded: false
    oidc_conformant: true
    refresh_token:
      expiration_type: non-expiring
      leeway: 0
      infinite_token_lifetime: true
      infinite_idle_token_lifetime: true
      token_lifetime: 2592000
      idle_token_lifetime: 1296000
      rotation_type: non-rotating
    sso_disabled: false
  - name: Werkpages Backend
    app_type: non_interactive
    cross_origin_authentication: false
    custom_login_page_on: true
    grant_types:
      - client_credentials
    is_first_party: true
    is_token_endpoint_ip_header_trusted: false
    jwt_configuration:
      alg: RS256
      lifetime_in_seconds: 36000
      secret_encoded: false
    oidc_conformant: true
    refresh_token:
      expiration_type: non-expiring
      leeway: 0
      infinite_token_lifetime: true
      infinite_idle_token_lifetime: true
      token_lifetime: 31557600
      idle_token_lifetime: 2592000
      rotation_type: non-rotating
    sso_disabled: false
    token_endpoint_auth_method: client_secret_post
  - name: Werkpages Web
    allowed_clients: []
    allowed_logout_urls:
      - http://localhost:8080
      - https://werkpages.ca
      - https://www.werkpages.ca
      - https://werkpages.ca/signin
      - http://localhost:8080/signin
    app_type: regular_web
    callbacks:
      - http://localhost:8080
      - https://werkpages.ca
      - https://www.werkpages.ca
      - https://werkpages.ca/signin
      - http://localhost:8080/signin
      - http://localhost:8080/auth/callback
      - https://werkpages.ca/auth/callback
    client_aliases: []
    cross_origin_authentication: false
    custom_login_page_on: true
    grant_types:
      - authorization_code
      - implicit
      - refresh_token
      - client_credentials
      - password
      - http://auth0.com/oauth/grant-type/password-realm
    is_first_party: true
    is_token_endpoint_ip_header_trusted: false
    jwt_configuration:
      alg: RS256
      lifetime_in_seconds: 36000
      secret_encoded: false
    native_social_login:
      apple:
        enabled: false
      facebook:
        enabled: false
    oidc_conformant: true
    refresh_token:
      expiration_type: non-expiring
      leeway: 0
      infinite_token_lifetime: true
      infinite_idle_token_lifetime: true
      token_lifetime: 31557600
      idle_token_lifetime: 2592000
      rotation_type: non-rotating
    sso_disabled: false
    token_endpoint_auth_method: client_secret_post
    web_origins:
      - http://localhost:8080
      - https://werkpages.ca
      - https://www.werkpages.ca
      - http://localhost:8080/signin
  - name: auth
    allowed_clients: []
    app_type: non_interactive
    callbacks: []
    client_aliases: []
    cross_origin_authentication: false
    custom_login_page_on: true
    grant_types:
      - client_credentials
    is_first_party: true
    is_token_endpoint_ip_header_trusted: false
    jwt_configuration:
      alg: RS256
      lifetime_in_seconds: 36000
      secret_encoded: false
    native_social_login:
      apple:
        enabled: false
      facebook:
        enabled: false
    oidc_conformant: true
    refresh_token:
      expiration_type: non-expiring
      leeway: 0
      infinite_token_lifetime: true
      infinite_idle_token_lifetime: true
      token_lifetime: 31557600
      idle_token_lifetime: 2592000
      rotation_type: non-rotating
    sso_disabled: false
    token_endpoint_auth_method: client_secret_post
databases:
  - name: Username-Password-Authentication
    strategy: auth0
    authentication:
      active: true
    connected_accounts:
      active: false
    enabled_clients:
      - auth
      - Auth0 Deploy CLI
      - Default App
      - Werkpages Backend
      - Werkpages Web
    is_domain_connection: false
    options: {}
    realms:
      - Username-Password-Authentication
connections:
  - name: facebook
    strategy: facebook
    authentication:
      active: true
    connected_accounts:
      active: false
    enabled_clients:
      - Auth0 Deploy CLI
      - Werkpages Web
    is_domain_connection: false
  - name: google-oauth2
    strategy: google-oauth2
    authentication:
      active: true
    connected_accounts:
      active: false
    enabled_clients:
      - auth
      - Auth0 Deploy CLI
      - Default App
      - Werkpages Backend
      - Werkpages Web
    is_domain_connection: false
  - name: windowslive
    strategy: windowslive
    authentication:
      active: true
    connected_accounts:
      active: false
    enabled_clients:
      - Auth0 Deploy CLI
      - Werkpages Web
    is_domain_connection: false
tenant:
  default_audience: ''
  default_directory: Username-Password-Authentication
  enabled_locales:
    - en
  flags:
    enable_custom_domain_in_emails: true
    revoke_refresh_token_grant: false
    improved_signup_bot_detection_in_classic: false
    disable_clickjack_protection_headers: false
  oidc_logout:
    rp_logout_end_session_endpoint_discovery: true
  picture_url: https://werkpages.ca/logo.png
  resource_parameter_profile: audience
  sandbox_version: '22'
  universal_login:
    colors:
      page_background: '#f9fafb'
      primary: '#641ae6'
emailProvider:
  name: smtp
  credentials:
    smtp_host: smtp.mailgun.org
    smtp_port: 587
    smtp_user: '##SMTP_USER##'
    smtp_pass: '##SMTP_PASS##'
  default_from_address: noreply@werkpages.ca
  enabled: true
branding:
  templates: []
actions:
  - name: Block Unverified Emails
    code: ./actions/Block Unverified Emails/code.js
    dependencies: []
    deployed: true
    runtime: node22
    secrets: []
    status: built
    supported_triggers:
      - id: post-login
        version: v3
triggers:
  post-login:
    - action_name: Block Unverified Emails
      display_name: Block Unverified Emails
userAttributeProfiles: []
connectionProfiles: []
tokenExchangeProfiles: []
