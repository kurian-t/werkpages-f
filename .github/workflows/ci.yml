name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ca-central-1
  ECR_REGISTRY: 138465306929.dkr.ecr.ca-central-1.amazonaws.com
  FRONTEND_IMAGE: 138465306929.dkr.ecr.ca-central-1.amazonaws.com/werkpages-frontend
  BACKEND_IMAGE: 138465306929.dkr.ecr.ca-central-1.amazonaws.com/werkpages-api

jobs:
  test:
    name: Playwright Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. This repo's package.json pins
      # packageManager: pnpm@10.14.0, and action-setup errors out if both are set.
      # (RateMyManagers can specify a version because its repo root package.json
      # has no packageManager field — the pinned one is a directory deeper.)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the React app with placeholder secrets.
      # All API/auth calls are mocked by Playwright — no real backend needed.
      # VITE_AUTH0_AUDIENCE must be non-empty or isSocialLoginConfigured() returns false
      # and the social login buttons never render.
      - name: Build client
        run: pnpm build:client
        env:
          VITE_AUTH0_DOMAIN: test.auth0.com
          VITE_AUTH0_CLIENT_ID: test_client_id_for_e2e
          VITE_AUTH0_AUDIENCE: https://api.test.example/
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium

      # vite preview serves dist/spa on port 4174 (4173 is RateMyManagers').
      # Playwright starts it automatically via playwright.config.ts.
      - name: Run Playwright tests
        run: pnpm exec playwright test --project=chromium

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  deploy:
    name: Build & Deploy
    needs: test
    if: github.event_name == 'push'
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ── Frontend ────────────────────────────────────────────────────────────
      - name: Build & push frontend
        run: |
          docker build --no-cache \
            --build-arg "VITE_API_URL=https://werkpages.com" \
            --build-arg "VITE_AUTH0_DOMAIN=${{ secrets.VITE_AUTH0_DOMAIN }}" \
            --build-arg "VITE_AUTH0_CLIENT_ID=${{ secrets.VITE_AUTH0_CLIENT_ID }}" \
            --build-arg "VITE_AUTH0_AUDIENCE=${{ secrets.VITE_AUTH0_AUDIENCE }}" \
            --build-arg "VITE_TURNSTILE_SITE_KEY=${{ secrets.VITE_TURNSTILE_SITE_KEY }}" \
            --build-arg "VITE_POSTHOG_KEY=${{ secrets.VITE_POSTHOG_KEY }}" \
            --build-arg "VITE_POSTHOG_HOST=${{ secrets.VITE_POSTHOG_HOST }}" \
            -t "${{ env.FRONTEND_IMAGE }}:latest" \
            -t "${{ env.FRONTEND_IMAGE }}:${{ github.sha }}" \
            -f Dockerfile .
          docker push ${{ env.FRONTEND_IMAGE }}:latest
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      # ── Backend ─────────────────────────────────────────────────────────────
      - name: Checkout backend repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BACKEND_REPO }}
          token: ${{ secrets.GH_PAT }}
          path: backend

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build backend JAR
        working-directory: backend
        run: mvn clean package

      - name: Build & push backend
        working-directory: backend
        run: |
          docker build \
            -t ${{ env.BACKEND_IMAGE }}:latest \
            -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} .
          docker push ${{ env.BACKEND_IMAGE }}:latest
          docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      # ── Deploy to EC2 via SSM (no open ports needed) ─────────────────────────
      # Only the two werkpages services are pulled and recreated. RateMyManagers'
      # containers are deliberately left running — its edge nginx re-resolves the
      # werkpages-frontend address at request time, so it picks up the new container
      # without a reload.
      - name: Deploy on EC2
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands=["aws ecr get-login-password --region ca-central-1 | docker login --username AWS --password-stdin 138465306929.dkr.ecr.ca-central-1.amazonaws.com && cd /home/ubuntu/app && docker compose pull werkpages-api werkpages-frontend && docker compose up -d werkpages-api werkpages-frontend && docker image prune -af"] \
            --region ca-central-1
