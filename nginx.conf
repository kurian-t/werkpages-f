# Werkpages frontend — internal only.
#
# This container is NOT the edge. The RateMyManagers frontend container owns ports 80/443 on the
# host, terminates TLS, and verifies the Cloudflare origin-pull client certificate; it proxies
# werkpages.com here over the Docker network. So there is no TLS, no redirect, and no client-cert
# check in this file — doing any of it again here would break the proxied request.
#
# Security headers stay here rather than at the edge because the CSP is per-site.

# Tarpit zone: 1 req/min per IP — queued requests stall for up to 60s each, exhausting scanner threads.
# Zone name must differ from the edge's `tarpit` zone; these are separate nginx instances, but
# keeping the names distinct avoids confusion when reading logs side by side.
limit_req_zone $binary_remote_addr zone=wp_tarpit:10m rate=1r/m;

server {
    listen 80;
    server_name _;

    # The edge already terminated TLS; trust its forwarded client address for rate limiting.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 172.16.0.0/12;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://eu-assets.i.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://challenges.cloudflare.com https://eu.i.posthog.com https://eu-assets.i.posthog.com; font-src 'self' https://fonts.gstatic.com; frame-src https://challenges.cloudflare.com; object-src 'none'; frame-ancestors 'none';" always;

    root /usr/share/nginx/html;
    index index.html;

    # Tarpit common scanner/attack paths — queue up to 2 requests per IP, reject the rest with 429
    location ~* ^/(\.env|\.git|\.htaccess|\.htpasswd|\.DS_Store|wp-admin|wp-login\.php|wp-config\.php|phpinfo\.php|adminer|phpmyadmin|config\.php|backup|setup\.php|install\.php|actuator|server-status|console) {
        limit_req zone=wp_tarpit burst=2;
        limit_req_status 429;
        return 429;
    }

    location /api/ {
        # werkpages-api, not api — `api` is the RateMyManagers backend on the same network.
        proxy_pass http://werkpages-api:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        # Cloudflare visitor-location headers (used by /api/geo and create endpoints),
        # forwarded from the edge.
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-Region    $http_cf_region;
        proxy_set_header CF-IPCity    $http_cf_ipcity;
    }

    # Proxy sitemap to Java backend (generated dynamically)
    location = /sitemap.xml {
        proxy_pass http://werkpages-api:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }


    # Vite fingerprints these (main-a1b2c3.js), so the URL changes whenever the content does.
    # Safe to cache forever. These headers pass back through the edge proxy to the browser and
    # to Cloudflare, which is what lets the CDN serve them without hitting this origin at all.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Files from public/ are NOT fingerprinted, so `immutable` is only safe because each one
    # carries a version in its filename (manager-insights-v6.webp). Bump the version when the
    # art changes — overwriting in place would leave visitors on the cached copy for a year.
    location ~* \.(webp|avif|png|jpe?g|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # index.html must never be cached, or a deploy ships new fingerprinted assets that no
    # returning visitor is ever told to fetch.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
}
