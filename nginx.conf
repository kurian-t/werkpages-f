# Tarpit zone: 1 req/min per IP — queued requests stall for up to 60s each, exhausting scanner threads
limit_req_zone $binary_remote_addr zone=tarpit:10m rate=1r/m;

server {
    listen 80;
    server_name ratemymanagers.ca www.ratemymanagers.ca;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ratemymanagers.ca www.ratemymanagers.ca;

    ssl_certificate /etc/letsencrypt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/privkey.pem;
    ssl_client_certificate /etc/nginx/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://eu-assets.i.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://challenges.cloudflare.com https://eu.i.posthog.com https://eu-assets.i.posthog.com; font-src 'self' https://fonts.gstatic.com; frame-src https://challenges.cloudflare.com; object-src 'none'; frame-ancestors 'none';" always;

    root /usr/share/nginx/html;
    index index.html;

    # Tarpit common scanner/attack paths — queue up to 2 requests per IP (each stalls ~60s), reject the rest with 429
    location ~* ^/(\.env|\.git|\.htaccess|\.htpasswd|\.DS_Store|wp-admin|wp-login\.php|wp-config\.php|phpinfo\.php|adminer|phpmyadmin|config\.php|backup|setup\.php|install\.php|actuator|server-status|console) {
        limit_req zone=tarpit burst=2;
        limit_req_status 429;
        return 429;
    }

    location /api/ {
        proxy_pass http://api:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie $http_cookie;
        # Cloudflare visitor-location headers (used by /api/geo and create endpoints).
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-Region    $http_cf_region;
        proxy_set_header CF-IPCity    $http_cf_ipcity;
    }

    # Proxy sitemap to Java backend (generated dynamically)
    location = /sitemap.xml {
        proxy_pass http://api:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}
